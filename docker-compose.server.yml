# Farm v1 Server Edition 正式部署编排
#
# 使用前：
# 1. 复制 .env.server.example 为 .env.server，并填写真实密钥；
# 2. 先执行 mvn clean package -DskipTests；
# 3. 执行 docker compose --env-file .env.server -f docker-compose.server.yml up -d --build。
#
# 数据库、Redis 和 RustFS 默认只加入内部网络，不直接暴露到宿主机。
# 需要升级已有数据时，先备份，再手工执行增量迁移 SQL。

services:
  farm:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FARM_IMAGE:-farm-server:1.0.0}
    container_name: farm-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      MYSQL_URL: jdbc:mysql://mysql:3306/farm?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_USERNAME: farm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-farm}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?ADMIN_SECRET_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      FARM_MONITOR_ENABLED: ${FARM_MONITOR_ENABLED:-false}
      FARM_MONITOR_PRINTER_IDS: ${FARM_MONITOR_PRINTER_IDS:-}
      FARM_SCHEDULER_ENABLED: ${FARM_SCHEDULER_ENABLED:-false}
      FARM_SCHEDULER_MAX_ITEMS_PER_RUN: ${FARM_SCHEDULER_MAX_ITEMS_PER_RUN:-0}
      FARM_WEBSOCKET_ENABLED: ${FARM_WEBSOCKET_ENABLED:-true}
      FILE_UPLOAD_PATH: /app/uploads
      LOG_FILE_PATH: /app/logs/farm.log
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
    ports:
      - "${FARM_BIND_ADDRESS:-0.0.0.0}:${FARM_HTTP_PORT:-8080}:8080"
    volumes:
      - farm_app_logs:/app/logs
      - farm_app_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  mysql:
    image: mysql:8.4
    container_name: farm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: farm
      MYSQL_USER: farm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - farm_mysql_data:/var/lib/mysql
      - ./src/main/resources/db/migration/farm.sql:/docker-entrypoint-initdb.d/01-farm.sql:ro
      - ./src/main/resources/db/migration/02-current-schema.sql:/docker-entrypoint-initdb.d/02-current-schema.sql:ro
      - ./src/main/resources/db/migration/03-remove-customer-role.sql:/docker-entrypoint-initdb.d/03-remove-customer-role.sql:ro
      - ./src/main/resources/db/migration/04-normalize-print-job-status.sql:/docker-entrypoint-initdb.d/04-normalize-print-job-status.sql:ro
      - ./src/main/resources/db/migration/05-normalize-printer-firmware-type.sql:/docker-entrypoint-initdb.d/05-normalize-printer-firmware-type.sql:ro
      - ./src/main/resources/db/migration/06-add-printer-status-history.sql:/docker-entrypoint-initdb.d/06-add-printer-status-history.sql:ro
      - ./src/main/resources/db/migration/07-v2-dispatch-plan.sql:/docker-entrypoint-initdb.d/07-v2-dispatch-plan.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    container_name: farm-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - farm_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  rustfs:
    image: ${RUSTFS_IMAGE:?RUSTFS_IMAGE is required; pin a tested tag or digest}
    container_name: farm-rustfs
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
    volumes:
      - farm_rustfs_data:/data

volumes:
  farm_app_logs:
  farm_app_uploads:
  farm_mysql_data:
  farm_redis_data:
  farm_rustfs_data:
