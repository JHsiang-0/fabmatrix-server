spring:
  config:
    activate:
      on-profile: dev

# 开发环境日志配置 - 更详细的日志输出
logging:
  level:
    root: WARN
    com.example.farm: WARN
    com.example.farm.mapper: WARN  # 打印SQL语句
    com.example.farm.task: WARN
    org.springframework.web: DEBUG
    org.springframework.web.socket: WARN
    org.apache.ibatis: DEBUG
    io.lettuce.core: INFO
    com.zaxxer.hikari: INFO
    org.springframework.web.client: WARN  # 屏蔽 WebClient REST 调用日志
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) - %msg%n"

# 开发环境服务器配置
server:
  port: ${SERVER_PORT:28081}
  tomcat:
    # 开发环境使用较小的线程池
    threads:
      max: 50
      min-spare: 5
    max-connections: 1000
    accept-count: 50

# 开发环境应用配置
farm:
  monitor:
    enabled: ${FARM_MONITOR_ENABLED:true}
    # 设备级开关在 farm_printer.monitor_enabled；此列表仅用于旧配置兼容
    printer-ids: []
    failure-threshold: 3
    recovery-success-threshold: 2
    idle-interval: 15s
    offline-interval: 30s
  scheduler:
    enabled: false
    max-items-per-run: 0
  tasks:
    # 监控由 farm.monitor.enabled 独立控制；后台自动派单仍保持关闭。
    enabled: false
  websocket:
    enabled: true
    max-connections: 100
  file:
    batch-max-files: 100
#  # Moonraker API 模拟器（开发环境使用固定密钥）
#  moonraker-api-key: dev-moonraker-key
