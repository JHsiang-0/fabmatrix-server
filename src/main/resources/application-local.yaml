spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:sqlite:${FARM_DATA_DIR:${user.home}/FarmData}/farm.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
  lifecycle:
    timeout-per-shutdown-phase: 20s
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/local-schema.sql

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  shutdown: graceful

farm:
  local:
    storage-path: ${FARM_DATA_DIR:${user.home}/FarmData}/files
  monitor:
    enabled: ${FARM_MONITOR_ENABLED:false}
    # 设备级开关在 farm_printer.monitor_enabled；此列表仅用于旧配置兼容
    printer-ids: []
    failure-threshold: 3
    recovery-success-threshold: 2
    idle-interval: 15s
    offline-interval: 30s
  scheduler:
    enabled: false
    max-items-per-run: 0
  websocket:
    enabled: ${FARM_WEBSOCKET_ENABLED:true}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    first-admin-setup-enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
